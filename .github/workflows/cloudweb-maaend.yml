name: Full MaaEnd CloudWeb Windows experiment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudweb-maaend-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  mxu:
    if: github.ref == 'refs/heads/experiment/cloud-web-controller-20261010'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: MistEO/MXU
          ref: 9fa8cc51e8ff8cd89d99f3ea55fe3a7a82e6ede3
          path: vendor/MXU
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply reviewed MXU integration patch
        run: python tools/CloudWebController/integration/build_full_package.py apply-mxu
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: vendor/MXU/pnpm-lock.yaml
      - name: Verify the runner's preinstalled Rust tools
        run: |
          New-Item -ItemType Directory -Force build-cloudweb-mxu/evidence | Out-Null
          rustc --version | Tee-Object build-cloudweb-mxu/evidence/preinstalled-rust.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version | Tee-Object -Append build-cloudweb-mxu/evidence/preinstalled-rust.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustfmt --version | Tee-Object -Append build-cloudweb-mxu/evidence/preinstalled-rust.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = rustc -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler | Add-Content build-cloudweb-mxu/evidence/preinstalled-rust.txt
          if (-not ($compiler -contains 'host: x86_64-pc-windows-msvc')) { throw 'The preinstalled Rust host is not Windows x64 MSVC' }
      - name: Format patched Rust with the preinstalled formatter and preserve exact source
        run: |
          cargo fmt --manifest-path vendor/MXU/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C vendor/MXU add --intent-to-add .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patch = Join-Path $env:GITHUB_WORKSPACE 'build-cloudweb-mxu/evidence/mxu-formatted.patch'
          git -C vendor/MXU diff --binary --output=$patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: vendor/MXU/src-tauri -> target
          shared-key: cloudweb-windows-x64
          cache-on-failure: true
      - name: Install locked frontend dependencies
        working-directory: vendor/MXU
        run: pnpm install --frozen-lockfile
      - name: Test and build original GUI with CloudWeb connection
        working-directory: vendor/MXU
        run: |
          New-Item -ItemType Directory -Force ../../build-cloudweb-mxu/evidence | Out-Null
          pnpm test 2>&1 | Tee-Object ../../build-cloudweb-mxu/evidence/frontend-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build 2>&1 | Tee-Object ../../build-cloudweb-mxu/evidence/frontend-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm tauri build --no-bundle --target x86_64-pc-windows-msvc -- --locked 2>&1 | Tee-Object ../../build-cloudweb-mxu/evidence/native-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native CloudWeb protocol and URL policy
        working-directory: vendor/MXU/src-tauri
        run: |
          cargo test --locked cloud_web -- --nocapture 2>&1 | Tee-Object ../../../build-cloudweb-mxu/evidence/native-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare modified full GUI executable
        run: |
          New-Item -ItemType Directory -Force build-cloudweb-mxu/artifact/build-evidence | Out-Null
          Copy-Item vendor/MXU/src-tauri/target/x86_64-pc-windows-msvc/release/mxu.exe build-cloudweb-mxu/artifact/mxu.exe
          Copy-Item vendor/MXU/LICENSE build-cloudweb-mxu/artifact/MXU-LICENSE
          Copy-Item build-cloudweb-mxu/evidence/* build-cloudweb-mxu/artifact/build-evidence/
          rustc --version | Set-Content build-cloudweb-mxu/artifact/build-evidence/toolchain.txt
          node --version | Add-Content build-cloudweb-mxu/artifact/build-evidence/toolchain.txt
          pnpm --version | Add-Content build-cloudweb-mxu/artifact/build-evidence/toolchain.txt
      - uses: actions/upload-artifact@v6
        with:
          name: cloudweb-mxu-${{ github.sha }}
          path: build-cloudweb-mxu/artifact/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cloudweb-mxu-logs-${{ github.sha }}
          path: build-cloudweb-mxu/evidence/
          if-no-files-found: warn
          retention-days: 14

  maaend-runtime:
    if: github.ref == 'refs/heads/experiment/cloud-web-controller-20261010'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Load pinned agent and model submodules
        run: git submodule update --init --depth 1 agent/cpp-algo/MaaUtils assets/resource/model
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go-service/go.mod
          cache-dependency-path: agent/go-service/go.sum
      - uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.5
        with:
          sdk-version: 26100
      - uses: actions/cache@v5
        with:
          path: |
            .cache/cloudweb-downloads
            agent/cpp-algo/MaaUtils/MaaDeps
          key: cloudweb-maadeps-windows-x64-v2.12.6-maafw-v5.14.2-${{ hashFiles('tools/maadeps-download.py') }}
      - name: Install pinned Python resource tooling
        run: python -m pip install json5==0.12.1 maafw==5.14.2 numpy==2.5.3 MaaAgentBinary==1.0.1 StrEnum==0.4.15
      - name: Download and verify native SDK dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force build-cloudweb-runtime-logs | Out-Null
          python tools/CloudWebController/integration/build_full_package.py download-framework
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/maadeps-download.py x64-windows 2>&1 | Tee-Object build-cloudweb-runtime-logs/maadeps.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.setup.dep_3rdparty --webview2 2>&1 | Tee-Object build-cloudweb-runtime-logs/webview2-sdk.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build current Go and C++ agents and install all MaaEnd assets
        run: |
          $version = "v2.32.0-cloudweb-dev.$($env:GITHUB_SHA.Substring(0, 12))"
          python -m tools.setup.build_and_install --cpp-algo --ci --os win --arch x86_64 --version $version 2>&1 | Tee-Object build-cloudweb-runtime-logs/agents-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/CloudWebController/integration/build_full_package.py install-framework
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/merge_pipeline.py install 2>&1 | Tee-Object build-cloudweb-runtime-logs/merge-resources.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/fill_interface.py --version $version --interface install/interface.json --maafw-lib-dir install/maafw 2>&1 | Tee-Object build-cloudweb-runtime-logs/resource-hashes.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem install/agent -Filter *.pdb | Remove-Item
          New-Item -ItemType Directory -Force install/build-evidence | Out-Null
          Copy-Item build-cloudweb-runtime-logs/* install/build-evidence/
          git submodule status | Set-Content install/build-evidence/submodules.txt
          go version | Set-Content install/build-evidence/toolchain.txt
          cmake --version | Add-Content install/build-evidence/toolchain.txt
      - uses: actions/upload-artifact@v6
        with:
          name: cloudweb-maaend-runtime-${{ github.sha }}
          path: install/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cloudweb-runtime-logs-${{ github.sha }}
          path: build-cloudweb-runtime-logs/
          if-no-files-found: warn
          retention-days: 14

  qt-host:
    if: github.ref == 'refs/heads/experiment/cloud-web-controller-20261010'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_OPENGL: software
      QT_QUICK_BACKEND: software
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: tools/CloudWebController/packaging/requirements-build.txt
      - name: Install internal embedded-browser build dependencies
        run: python -m pip install -r tools/CloudWebController/packaging/requirements-build.txt
      - name: Build and verify the internal browser process
        run: |
          python tools/CloudWebController/packaging/build_windows.py test-source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/CloudWebController/test_qt_input.py 2>&1 | Tee-Object build-cloudweb-windows/logs/native-input.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/CloudWebController/packaging/build_windows.py build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/CloudWebController/packaging/build_windows.py test-frozen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/CloudWebController/test_mxu_protocol.py --integration --executable build-cloudweb-windows/dist/MaaEnd-CloudWeb-Prototype/MaaEnd-CloudWeb-Prototype.exe --output build-cloudweb-windows/logs/mxu-protocol-report.json 2>&1 | Tee-Object build-cloudweb-windows/logs/mxu-protocol.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force build-cloudweb-windows/dist/MaaEnd-CloudWeb-Prototype/build-evidence | Out-Null
          Copy-Item build-cloudweb-windows/logs build-cloudweb-windows/dist/MaaEnd-CloudWeb-Prototype/build-evidence/ -Recurse
          Copy-Item build-cloudweb-windows/frozen-smoke build-cloudweb-windows/dist/MaaEnd-CloudWeb-Prototype/build-evidence/ -Recurse
          Copy-Item build-cloudweb-windows/frozen-webrtc build-cloudweb-windows/dist/MaaEnd-CloudWeb-Prototype/build-evidence/ -Recurse
      - uses: actions/upload-artifact@v6
        with:
          name: cloudweb-internal-host-${{ github.sha }}
          path: build-cloudweb-windows/dist/MaaEnd-CloudWeb-Prototype/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cloudweb-host-logs-${{ github.sha }}
          path: |
            build-cloudweb-windows/logs/
            build-cloudweb-windows/source-smoke/
            build-cloudweb-windows/frozen-smoke/
            build-cloudweb-windows/frozen-webrtc/
          if-no-files-found: warn
          retention-days: 14

  full-package:
    needs: [mxu, maaend-runtime, qt-host]
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_OPENGL: software
      QT_QUICK_BACKEND: software
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install screenshot and config verification tooling
        run: python -m pip install Pillow==12.3.0 json5==0.12.1
      - uses: actions/download-artifact@v7
        with:
          name: cloudweb-mxu-${{ github.sha }}
          path: build-cloudweb-inputs/mxu
      - uses: actions/download-artifact@v7
        with:
          name: cloudweb-maaend-runtime-${{ github.sha }}
          path: build-cloudweb-inputs/maaend-runtime
      - uses: actions/download-artifact@v7
        with:
          name: cloudweb-internal-host-${{ github.sha }}
          path: build-cloudweb-inputs/qt-host
      - name: Assemble the full MaaEnd application
        run: python tools/CloudWebController/integration/build_full_package.py assemble
      - name: Verify native custom controller and original Maa Tasker
        run: python tools/CloudWebController/integration/build_full_package.py test-native
      - name: Capture the full MaaEnd task-list and connection UI
        run: |
          python tools/CloudWebController/integration/build_full_package.py seed-ui-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tools/CloudWebController/integration/capture_window.ps1
      - name: Produce full portable MaaEnd ZIP and checksum
        run: python tools/CloudWebController/integration/build_full_package.py archive
      - uses: actions/upload-artifact@v6
        with:
          name: MaaEnd-CloudWeb-full-Windows-x64-${{ github.sha }}
          path: build-cloudweb-full/deliverables/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: MaaEnd-CloudWeb-full-verification-${{ github.sha }}
          path: |
            build-cloudweb-full/verification/
            build-cloudweb-full/MaaEnd-CloudWeb/cloudweb-build-info.json
          if-no-files-found: warn
          retention-days: 14
